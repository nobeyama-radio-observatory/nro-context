# 資産の台帳：45m 鏡の観測システム
# 項目の定義は README.md を参照。
# 初版の下書き（2026-11-18）。公開資料から AI が埋めた。未記入は担当と保守の担い手が埋める。
#
# 出典の略記
#   データシート：45m 鏡のデータシート https://www.nro.nao.ac.jp/en/projects/45m/datasheets/ （2026-11-18 に確認）
#   障害情報：NRO45m 障害情報 https://www.nro.nao.ac.jp/projects/45m/projects-45m-trouble/ （2026年11月12日更新の版）
#   技術シンポ2019：https://www2.nao.ac.jp/~open-info/engipromo/draftparts_2019/gk/tecsym19_Miyazawa_Chieko.pdf
#   年次報告YYYY：https://www.nao.ac.jp/contents/about/reports/annual-report-ja/annualYYYY-j.pdf
#   経緯：../history/README.md

- id: nro45m
  name: 45m 電波望遠鏡
  kind: アンテナ
  status: 運用中
  offered: 提供
  introduced: 1982年（観測と共同利用の開始。試験観測は1981年）
  maintenance:
    by: 所内、メーカー
    condition: 2026年11月に、駆動の制御架に異常表示が出たが駆動には影響がなく、メーカーと協力して調査中
    effort: 未記入
  renewal: 未記入
  owner_role: 未定
  maintainers: 未記入
  docs: データシート
  sources:
    - 導入：経緯（沿革、45m 鏡のページ）
    - 保守：障害情報 Trouble ID 2026-5
  note: 観測できる周波数は 20〜116 GHz（データシート）


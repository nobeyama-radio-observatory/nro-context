- id: be-continuum
  name: 連続波のバックエンド（Continuum BE）
  kind: 分光計
  part_of: nro45m
  depends_on: [if-system]
  status: 運用中
  offered: 所内のみ
  introduced: 未記入
  maintenance: {by: 未記入, condition: 未記入, effort: 未記入}
  renewal: 未記入
  owner_role: 未定
  maintainers: 未記入
  docs: データシート
  sources:
    - データシート（連続波の観測は、科学観測としては提供せず、ポインティングの観測だけに使う）

# 制御と時刻

- id: sw-cosmos
  name: COSMOS（観測制御ソフトウェア）
  kind: ソフトウェア
  part_of: nro45m
  status: 運用中
  introduced: 第3世代（COSMOS-3）が2003年に報告されている
  maintenance: {by: 所内, condition: 未記入, effort: 未記入}
  renewal: 未記入
  owner_role: 未定
  maintainers: 未記入
  sources:
    - 名称と役割：障害情報 Trouble ID 2026-2、Trouble ID 2026-5
    - 導入：年次報告2002（論文の一覧にある COSMOS-3 の報告）
  note: 構成の詳細は入れない

- id: time-standard
  name: 標準時計（水素メーザーを基準とする）
  kind: 時刻
  part_of: nro45m
  status: 運用中
  maintenance:
    by: 所内、水沢 VLBI 観測所
    condition: 2023年度に水素メーザー時計が故障して VLBI 観測の提供を止め、電源を修理して復旧。2026年11月に原因不明の時刻のずれがあり、様子を見ている
    effort: 未記入
  renewal: 未記入
  owner_role: 未定
  maintainers: 未記入
  sources:
    - 故障と修理：日本天文学会2025年秋季年会 https://www.asj.or.jp/nenkai/archive/2025b/pdf/V127b.pdf
    - 時刻のずれ：障害情報 Trouble ID 2026-4
    - VLBI 観測の提供の条件：有料望遠鏡時間の案内 https://www.nro.nao.ac.jp/projects/45m/charge-for-the-nobeyama-45-m-telescope-time/ 、プロポーザルの募集 https://www.nro.nao.ac.jp/projects/45m/proposals/calls/
  note: 単一鏡の観測には影響が小さく、VLBI 観測に影響する。VLBI のバックエンドは、水沢 VLBI 観測所が支援できる場合だけ提供される。HINOTORI-TZ の VLBI モードは調整中で使えない。2023年度の故障の後に VLBI 観測の提供が再開されたかは未確認

  owner_role: 計算機グループ
  update: 随時
  disclosure: 公開
  status: 稼働
  note: 2026-11-18 に作成。担当は聞き取り（nro-data の interviews/2026-11-18.md 問1）による。三鷹の NRODB と電波アーカイブは天文データセンターと外部の事業者の補助を受け、電波アーカイブの運用は天文データセンター、ASTE、観測所の合同。


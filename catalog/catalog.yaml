  description: 45m 鏡の観測制御（COSMOS、観測の操作のユーザーインターフェース、リモート観測のシステム、制御用の計算機と仮想化の基盤）の運用リポジトリ。台帳ファイル、運用と保守の文書、聞き取りの記録を置く。

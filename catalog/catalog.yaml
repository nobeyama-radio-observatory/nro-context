- name: nro-time-standard
  url: https://github.com/nobeyama-radio-observatory/nro-time-standard
  kind: ops
  categories: [資産]
  description: 標準時計（水素メーザーを基準とする）の運用リポジトリ。台帳ファイル、運用と保守の文書、聞き取りの記録を置く。
  owner_role: 装置システムグループ
  update: 随時
  disclosure: 公開
  status: 稼働
  note: 2026-11-18 に作成。担当は聞き取り（nro-45m-if の interviews/2026-11-18.md 問1・問3・問5）による。この目録の owner_role は、このリポジトリを担当する役割。台帳の time-standard の owner_role（水沢 VLBI 観測所）は、装置そのものを管理する組織で、対象が違う。水素メーザーは水沢 VLBI 観測所の管理で、保守を装置システムグループが補助する。


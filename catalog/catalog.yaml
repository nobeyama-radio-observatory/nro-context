# 目録：文脈基盤に関わるリポジトリの一覧
# 項目の定義は schema.md を参照。

- name: nro-context
  url: https://github.com/nobeyama-radio-observatory/nro-context
  kind: hub
  categories: []
  description: 文脈基盤のハブ。全体の索引、共通の決まり、判断記録、上流の問い、観測所共通のスキルの正本を置く。
  owner_role: 所長
  update: 随時
  disclosure: 公開
  status: 準備中

- name: nro-45m-spectrometer
  url: https://github.com/nobeyama-radio-observatory/nro-45m-spectrometer
  kind: ops
  categories: [資産]
  description: 45m 鏡の分光計（SAM45、YATSUGATAKE、SAM45 互換のソフトウェア）の運用リポジトリ。台帳ファイル、運用と保守の文書、聞き取りの記録を置き、製品と開発のリポジトリを参照する。
  owner_role: 計算機グループ
  update: 随時
  disclosure: 公開
  status: 稼働
  note: 2026-11-18 に作成。担当は聞き取り（nro-45m-spectrometer の interviews/2026-11-18.md 問0、問9）による。製品と開発のリポジトリ（YATSUGATAKE、YATSUGATAKE-NRO45-sam45compat、study-rfsoc）は、ここの台帳から参照する。2026-11-18 にほかの装置群の運用リポジトリも作り、ハブの assets/ の仮置きの台帳は空になった（判断記録 0006）。

